version: 2
multi-ecosystem-groups:
  # Ruff is pinned in both the dev extra and the pre-commit hooks.
  python:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    cooldown:
      default-days: 7
    patterns: ['*']
    multi-ecosystem-group: python
  - package-ecosystem: pre-commit
    directory: /
    cooldown:
      default-days: 7
    patterns: ['*']
    multi-ecosystem-group: python
