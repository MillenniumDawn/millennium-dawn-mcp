# Repo-own hooks (Python hygiene). Mypy runs in CI, not here: the mirrors-mypy
# hook would need every runtime dep duplicated in additional_dependencies.
# Keep the ruff rev in lockstep with the pin in pyproject.toml dev extras.
# Fixtures are Paradox-format files (loc "yml" is not YAML; byte-exact content).
exclude: ^tests/fixtures/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
