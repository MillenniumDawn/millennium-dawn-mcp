[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-mcp"
version = "0.1.0"
description = "MCP server for Millennium Dawn HOI4 mod development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.0,<2",
  "tomli>=2.0; python_version < '3.11'",
  "pyyaml>=6.0",
  "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-xdist>=3.0",
  "coverage>=7.0",
  "diff-cover>=9.0",
  "ruff==0.8.6",
  "mypy>=1.14",
  "types-PyYAML",
  "pre-commit>=4.0",
]

[project.scripts]
md-mcp = "md_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "integration: requires a real Millennium-Dawn checkout (set MD_MOD_ROOT)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "W"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tool docstrings are the exact MCP descriptions sent to agents; keep them one-line.
"src/md_mcp/server.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["md_mcp"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*", "yaml", "mcp", "mcp.*"]
ignore_missing_imports = true
